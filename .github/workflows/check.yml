name: Check website

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate website
        run: python scripts/check_site.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install browser check tooling
        run: python -m pip install playwright==1.65.2
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check browser interactions
        run: python scripts/check_browser.py
